# Canonical version: 2026.11.03 (generic)
#
# Dependabot configuration.
#
# One package ecosystem: github-actions for workflow actions. The bundle is
# markdown plus shell, so there is no language manifest to watch. Weekly
# Monday scans; minor + patch action updates group into one PR per week. The
# version-update block ignores semver-major, so no major version update opens
# a PR: a major is a reviewed bump a maintainer makes by hand. A security fix
# that needs a major is the exception (see the security block below).
#
# `target-branch: dev` is non-negotiable on the version-update block.
# Without it, Dependabot defaults to `main` and the PR fails the dev →
# release/* → main flow that guard-release-branch.yml enforces. Retargeting
# after the fact orphans-and-closes the PR irreversibly (see
# github-repo-setup's references/dependabot.md § "Why target-branch: dev is
# non-negotiable").
#
# Security updates are the exception: Dependabot raises them against the
# default branch and ignores every option on a block that carries
# `target-branch`, so without a block of their own each advisory becomes its
# own ungrouped PR on main. The trailing block has no target-branch,
# `open-pull-requests-limit: 0` so it never opens version updates there, and
# a group with `applies-to: security-updates` that batches minor and patch
# fixes per run. A fix that needs a major stays its own PR. Cooldown, the
# majors ignore, and lockfile pinning are deliberately absent from it:
# cooldown is a version-update option, and the other two would suppress a
# fix that resolves outside the current range.
#
# The github-actions group uses `patterns` rather than `update-types`
# because a SHA pin's SemVer level comes from a trailing comment and an
# unclassifiable action would otherwise fall out of the group and open alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      actions-security-minor-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
